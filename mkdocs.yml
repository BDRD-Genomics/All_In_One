site_name: All-In-One Sequencing Pipeline
site_description: Documentation for the BDRD-Genomics All-In-One Nextflow sequencing pipeline
site_url: https://bdrd-genomics.github.io/All_In_One/
repo_url: https://github.com/BDRD-Genomics/All_In_One
repo_name: BDRD-Genomics/All_In_One
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Usage: usage.md
  - Parameters: parameters.md
  - Configuration: configuration.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
