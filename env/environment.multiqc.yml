name: multiqc

channels:
  - conda-forge
  - bioconda

dependencies:
  # MultiQC
  - python=3.11
  - multiqc=1.23

  # R
  - r-base

  # R packages used by All_In_One QC/reporting scripts
  - r-optparse
  - r-readxl
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-scales
  - r-ggpubr
  - r-stringr
  - r-readr
  - r-reshape2
  - r-plyr
  - r-pheatmap
  - r-openxlsx
  - r-officer
  - r-magick
  - r-fs
  - r-rmarkdown
  - r-vroom

  # Needed by rmarkdown when rendering reports
  - pandoc