name: multiqc

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - multiqc=1.23

  # R runtime and packages used by pipeline reporting scripts
  - r-base
  - r-optparse
  - r-scales
  - r-openxlsx

  # Static plot rendering for MultiQC 1.23
  - python-kaleido=0.2.1
  - kaleido-core=0.2.1

  # Fonts
  - fontconfig
  - fonts-conda-forge